name: Release

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            apps/web/package-lock.json

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix site
          npm ci --prefix apps/web
        env:
          BLIPCOARD_SKIP_POSTINSTALL: "1"

      - name: Validate release inputs
        run: |
          cargo test --workspace --lib --bins --tests --locked
          npm run docs:build
          npm run web:build

      - name: Check npm release token
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping semantic-release because the NPM_TOKEN repository secret is not configured."
          fi

      - name: Check release baseline
        id: release-baseline
        run: |
          if git tag --list 'v*' | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping semantic-release because no v* baseline tag exists yet."
          fi

      - name: Release
        if: steps.npm-token.outputs.available == 'true' && steps.release-baseline.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
