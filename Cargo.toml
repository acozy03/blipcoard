[workspace]
members = [
  "crates/blip-api",
  "crates/blip-cli",
  "crates/blip-clipboard",
  "crates/blip-config",
  "crates/blip-core",
  "crates/blip-daemon",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Adrian Cosentino"]

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
